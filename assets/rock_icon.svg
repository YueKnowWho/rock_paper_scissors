<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="90" fill="#1b263b" stroke="#3b82f6" stroke-width="8"/>
  <!-- Rock shape -->
  <g transform="translate(45, 45) scale(0.6)">
    <polygon points="110,20 160,50 180,110 140,160 70,170 30,120 40,60" fill="#78869b"/>
    <polygon points="110,20 140,80 180,110 110,120" fill="#9aa8bc"/>
