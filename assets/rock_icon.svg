    <line x1="110" y1="20" x2="110" y2="120" stroke="#4a586d" stroke-width="3"/>
    <line x1="110" y1="120" x2="140" y2="160" stroke="#4a586d" stroke-width="3"/>
    <line x1="110" y1="120" x2="70" y2="170" stroke="#4a586d" stroke-width="3"/>
    <circle cx="130" cy="50" r="6" fill="#b0bed2" opacity="0.6"/>
